[project]
name = "messages-cli"
version = "0.3.0"
description = "Unified CLI for reading, searching, and sending messages across all your messaging apps"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "phonenumbers>=8.13",
    "pycryptodome>=3.20",
    "mmh3>=4.1,<5",
    "telethon>=1.42.0",
    "requests>=2.32.5",
    "pywebview>=6.1",
    "sqlcipher3-wheels>=0.5.7",
]

[project.scripts]
messages = "messages_cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["messages_cli"]

[tool.hatch.build.targets.wheel.force-include]
"go/whatsapp" = "messages_cli/go/whatsapp"
"go/messenger" = "messages_cli/go/messenger"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
