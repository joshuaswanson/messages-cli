<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 40 216 192" width="216" height="192" role="img" aria-label="messages-cli logo">
  <defs>
    <linearGradient id="m-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EF08F"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="m-middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#239F69"/><stop offset="1" stop-color="#0E8AA3"/>
    </linearGradient>
    <linearGradient id="m-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155C44"/><stop offset="1" stop-color="#0B4F61"/>
    </linearGradient>
    <path id="m-frontShape" d="M72 84 H168 A32 32 0 0 1 200 116 V164 A32 32 0 0 1 168 196 H100 L54 224 C46 212 40 196 40 176 V116 A32 32 0 0 1 72 84 Z"/>
    <rect id="m-middleShape" x="60" y="66" width="160" height="112" rx="32"/>
    <mask id="m-cutMiddle" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="#fff"/>
      <use href="#m-middleShape" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
    </mask>
    <mask id="m-cutFront" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="#fff"/>
      <use href="#m-frontShape" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
    </mask>
    <mask id="m-cutPrompt" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="#fff"/>
      <polyline points="84,120 106,140 84,160" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="120" y="151" width="42" height="12" rx="6" fill="#000"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/></rect>
    </mask>
  </defs>
  <g mask="url(#m-cutMiddle)">
    <rect x="80" y="48" width="160" height="112" rx="32" fill="url(#m-back)"/>
  </g>
  <g mask="url(#m-cutFront)">
    <use href="#m-middleShape" fill="url(#m-middle)"/>
  </g>
  <g mask="url(#m-cutPrompt)">
    <use href="#m-frontShape" fill="url(#m-front)"/>
  </g>
</svg>
